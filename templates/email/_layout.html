<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{ app_name }}</title></head>
<body bgcolor="#f3f1ec" style="margin:0;padding:0;background:#f3f1ec;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" bgcolor="#f3f1ec" style="background:#f3f1ec;">
    <tr><td align="center" style="padding:32px 16px;">
      <table role="presentation" width="560" cellpadding="0" cellspacing="0" style="max-width:560px;width:100%;background:#ffffff;border:1px solid #e2ddd2;border-radius:10px;">
        <tr><td style="padding:28px 32px 0 32px;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:bold;color:#12324a;">{{ app_name }}</td></tr>
        <tr><td style="padding:16px 32px 32px 32px;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.6;color:#1d2733;">
          {% block body %}{% endblock %}
        </td></tr>
      </table>
      <p style="font-family:Arial,Helvetica,sans-serif;font-size:12px;color:#6b7280;margin:16px 0 0 0;">You received this email because of activity on a {{ app_name }} account.</p>
    </td></tr>
  </table>
</body>
</html>
