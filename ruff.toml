line-length = 110
target-version = "py311"
extend-exclude = ["migrations", ".venv"]

[lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE"]
ignore = ["S101", "B008"]

[lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S311", "S104", "BLE001", "E501", "F811"]
"scripts/*" = ["S101", "BLE001"]
"*/models.py" = ["E501"]
"research_tools/*" = ["E501"]  # long regex / domain tables
"research/evidence.py" = ["E501"]
"agents/*" = ["E501"]
"jobs/*" = ["E501"]
"research/services.py" = ["E501"]
"research/routes.py" = ["E501"]  # prompts and long message strings
"reports/editing.py" = ["E501"]
"reports/routes.py" = ["E501"]
"reports/quality.py" = ["E501"]
"reports/exports.py" = ["E501"]
"settings/services.py" = ["E501"]
"settings/routes.py" = ["E501"]
